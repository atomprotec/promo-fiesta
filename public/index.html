<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promo Fiesta App 🎈</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen selection:bg-amber-400 selection:text-slate-950">

    <div id="app"></div>

    <script>
        // La API apunta a /api para ser compatible automáticamente con Render y Local
        const API = '/api';
        let token = localStorage.getItem('token') || '';
        let role = localStorage.getItem('role') || '';
        let nombre = localStorage.getItem('nombre') || '';
        let carrito = {};
        let productos = [];
        let resumen = null;
        let misVentasCant = 0;

        function render() {
            const app = document.getElementById('app');

            if (!token) {
                app.innerHTML = `
                    <div class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-slate-950 via-slate-900 to-indigo-950">
                        <div class="bg-slate-900 border-2 border-slate-800 p-8 rounded-3xl shadow-2xl w-full max-w-md text-center relative overflow-hidden">
                            <div class="absolute -top-10 -right-10 w-32 h-32 bg-amber-400/10 rounded-full blur-2xl"></div>
                            <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-rose-500/10 rounded-full blur-2xl"></div>

                            <span class="text-6xl inline-block mb-3 transform hover:scale-110 transition duration-200">🎉</span>
                            <h1 class="text-4xl font-black tracking-tight text-white mb-1">PROMO FIESTA</h1>
                            <p class="text-slate-400 font-semibold text-sm mb-6">Punto de Venta & Administración</p>

                            <form onsubmit="login(event)" class="space-y-4 text-left">
                                <div>
                                    <label class="block font-bold text-xs uppercase tracking-wider text-slate-400 mb-1">Correo Electrónico</label>
                                    <input type="email" id="email" required class="w-full p-4 bg-slate-950 border-2 border-slate-800 focus:border-amber-400 rounded-2xl text-white outline-none font-medium transition" placeholder="admin@promofiesta.com">
                                </div>
                                <div>
                                    <label class="block font-bold text-xs uppercase tracking-wider text-slate-400 mb-1">Contraseña</label>
                                    <input type="password" id="password" required class="w-full p-4 bg-slate-950 border-2 border-slate-800 focus:border-amber-400 rounded-2xl text-white outline-none font-medium transition" placeholder="••••••••">
                                </div>
                                <button type="submit" class="w-full bg-gradient-to-r from-amber-400 to-amber-500 hover:from-amber-300 hover:to-amber-400 text-slate-950 font-black text-lg p-4 rounded-2xl shadow-lg transition transform active:scale-95">
                                    INGRESAR AL SISTEMA 🚀
                                </button>
                            </form>
                        </div>
                    </div>`;
                return;
            }

            app.innerHTML = `
                <!-- BARRA SUPERIOR FESTIVA -->
                <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50">
                    <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
                        <div class="flex items-center gap-3">
                            <span class="text-3xl">🎈</span>
                            <div>
                                <h1 class="text-xl font-black tracking-wider text-amber-400 leading-none">PROMO FIESTA</h1>
                                <p class="text-xs text-slate-400 font-medium">${nombre} <span class="text-slate-600">|</span> <span class="text-amber-400/80 uppercase text-[10px] tracking-widest font-bold">${role === 'OWNER' ? 'JEFE' : 'TRABAJADOR'}</span></p>
                            </div>
                        </div>

                        <div class="flex items-center gap-2">
                            <button onclick="fichajeEntrada()" class="bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-3 py-2 rounded-xl text-xs font-bold transition">🟢 Llegué</button>
                            <button onclick="fichajeSalida()" class="bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 px-3 py-2 rounded-xl text-xs font-bold transition">🔴 Me voy</button>
                            <button onclick="logout()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-2 rounded-xl text-xs font-bold transition">Salir</button>
                        </div>
                    </div>
                </header>

                <main class="max-w-5xl mx-auto p-4 space-y-8 mt-2">
                    <!-- CATÁLOGO DE COBRO -->
                    <section class="bg-slate-900 border-2 border-slate-800 rounded-3xl p-6 relative overflow-hidden">
                        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
                            <div>
                                <h2 class="text-2xl font-black text-white flex items-center gap-2">
                                    <span>🛒</span> REGISTRAR VENTA
                                </h2>
                                <p class="text-xs text-slate-400">Toca las cantidades para sumar al pedido del cliente</p>
                            </div>

                            <div class="bg-slate-950 border border-slate-800 px-4 py-2 rounded-2xl flex items-center gap-3">
                                <span class="text-2xl">🔥</span>
                                <div>
                                    <span class="text-[10px] uppercase tracking-widest font-extrabold text-slate-500 block">Mis Ventas Hoy</span>
                                    <span class="text-xl font-black text-amber-400">${misVentasCant}</span>
                                </div>
                            </div>
                        </div>

                        <div id="productos-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>

                        <button onclick="cobrar()" class="w-full mt-6 bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-slate-950 font-black text-2xl py-5 rounded-2xl shadow-xl transition transform active:scale-98 flex items-center justify-center gap-3">
                            <span>✔</span> CONFIRMAR Y COBRAR VENTA
                        </button>
                    </section>

                    <!-- PANEL DEL JEFE -->
                    ${role === 'OWNER' ? `
                        <section class="bg-slate-900 border-2 border-amber-500/20 rounded-3xl p-6 space-y-6">
                            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-slate-800 pb-4">
                                <div class="flex items-center gap-3">
                                    <span class="text-3xl">👑</span>
                                    <div>
                                        <h2 class="text-2xl font-black text-amber-400">PANEL DEL JEFE</h2>
                                        <p class="text-xs text-slate-400">Control total de ventas, empleados y stock</p>
                                    </div>
                                </div>
                                <button onclick="reiniciarCaja()" class="bg-rose-500/20 hover:bg-rose-500/30 text-rose-400 border border-rose-500/40 font-black text-xs px-4 py-2.5 rounded-xl transition flex items-center gap-2">
                                    <span>🔄</span> REINICIAR CAJA Y RENDIMIENTO
                                </button>
                            </div>

                            <!-- MÉTRICAS DE CAJA -->
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div class="bg-slate-950 p-6 rounded-2xl border border-slate-800">
                                    <p class="text-xs font-extrabold uppercase tracking-widest text-slate-500">Total Recaudado en Caja</p>
                                    <p class="text-4xl font-black text-emerald-400 mt-2">$${resumen && resumen.totalDineroGeneral ? resumen.totalDineroGeneral.toLocaleString() : 0}</p>
                                </div>
                                <div class="bg-slate-950 p-6 rounded-2xl border border-slate-800">
                                    <p class="text-xs font-extrabold uppercase tracking-widest text-slate-500">Ventas Totales Realizadas</p>
                                    <p class="text-4xl font-black text-indigo-400 mt-2">${resumen && resumen.cantidadVentas ? resumen.cantidadVentas : 0}</p>
                                </div>
                            </div>

                            <!-- VENTAS POR TRABAJADOR -->
                            <div class="bg-slate-950 p-6 rounded-2xl border border-slate-800">
                                <h3 class="text-lg font-black text-amber-300 mb-4 flex items-center gap-2">
                                    <span>👥</span> Rendimiento por Trabajador
                                </h3>
                                <div class="space-y-2">
                                    ${resumen && resumen.ventasPorTrabajador && resumen.ventasPorTrabajador.length > 0 ? resumen.ventasPorTrabajador.map(t => `
                                        <div class="flex justify-between items-center bg-slate-900 p-3.5 rounded-xl border border-slate-800/80 text-sm">
                                            <span class="font-bold text-slate-200">${t.empleado} <span class="text-xs font-normal text-slate-500">(${t.cantidadVentas || 0} ventas)</span></span>
                                            <span class="text-emerald-400 font-black text-base">$${t.totalVendido ? t.totalVendido.toLocaleString() : 0}</span>
                                        </div>
                                    `).join('') : '<p class="text-slate-500 text-sm">Sin ventas de empleados aún</p>'}
                                </div>
                            </div>

                            <!-- CONTROL DE STOCK Y PRECIOS -->
                            <div class="bg-slate-950 p-6 rounded-2xl border border-slate-800">
                                <h3 class="text-lg font-black text-white mb-4 flex items-center gap-2">
                                    <span>📦</span> Control de Stock y Precios
                                </h3>
                                <div class="space-y-3">
                                    ${resumen && resumen.productos ? resumen.productos.map(p => `
                                        <div class="flex flex-col sm:flex-row justify-between items-center bg-slate-900 p-4 rounded-xl border border-slate-800 gap-3">
                                            <div class="flex items-center gap-3">
                                                <span class="text-3xl">${p.imagen}</span>
                                                <span class="font-black text-white">${p.nombre}</span>
                                            </div>
                                            <div class="flex items-center gap-2">
                                                <input type="number" id="precio-${p.id}" value="${p.precio}" class="w-24 p-2 bg-slate-950 border border-slate-700 rounded-xl text-center text-white font-bold text-sm">
                                                <input type="number" id="stock-${p.id}" value="${p.stock}" class="w-20 p-2 bg-slate-950 border border-slate-700 rounded-xl text-center text-white font-bold text-sm">
                                                <button onclick="actualizarStock(${p.id})" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl text-xs font-black transition">Guardar</button>
                                            </div>
                                        </div>
                                    `).join('') : ''}
                                </div>
                            </div>

                            <!-- AGREGAR NUEVO PRODUCTO -->
                            <div class="bg-slate-950 p-6 rounded-2xl border border-slate-800">
                                <h3 class="text-lg font-black text-white mb-4 flex items-center gap-2">
                                    <span>➕</span> Crear Nuevo Producto
                                </h3>
                                <form onsubmit="crearProducto(event)" class="grid grid-cols-1 sm:grid-cols-4 gap-3">
                                    <input type="text" id="prod-nombre" placeholder="Nombre (ej: Gaseosa 2.25L)" required class="p-3 bg-slate-900 border border-slate-800 rounded-xl text-white text-sm outline-none focus:border-amber-400">
                                    <input type="number" id="prod-precio" placeholder="Precio ($)" required class="p-3 bg-slate-900 border border-slate-800 rounded-xl text-white text-sm outline-none focus:border-amber-400">
                                    <input type="number" id="prod-stock" placeholder="Stock Inicial" required class="p-3 bg-slate-900 border border-slate-800 rounded-xl text-white text-sm outline-none focus:border-amber-400">
                                    <input type="text" id="prod-imagen" placeholder="Emoji (ej: 🥤)" class="p-3 bg-slate-900 border border-slate-800 rounded-xl text-white text-sm outline-none focus:border-amber-400">
                                    <button type="submit" class="sm:col-span-4 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black p-3.5 rounded-xl mt-1 text-sm transition">CREAR PRODUCTO 🚀</button>
                                </form>
                            </div>

                            <!-- CREAR TRABAJADOR -->
                            <div class="bg-slate-950 p-6 rounded-2xl border border-slate-800">
                                <h3 class="text-lg font-black text-white mb-4 flex items-center gap-2">
                                    <span>👤</span> Crear Cuenta de Trabajador
                                </h3>
                                <form onsubmit="crearEmpleado(event)" class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                    <input type="text" id="emp-nombre" placeholder="Nombre del Empleado" required class="p-3 bg-slate-900 border border-slate-800 rounded-xl text-white text-sm outline-none focus:border-amber-400">
                                    <input type="email" id="emp-email" placeholder="Correo de ingreso" required class="p-3 bg-slate-900 border border-slate-800 rounded-xl text-white text-sm outline-none focus:border-amber-400">
                                    <input type="password" id="emp-pass" placeholder="Contraseña" required class="p-3 bg-slate-900 border border-slate-800 rounded-xl text-white text-sm outline-none focus:border-amber-400">
                                    <button type="submit" class="sm:col-span-3 bg-amber-400 hover:bg-amber-300 text-slate-950 font-black p-3.5 rounded-xl mt-1 text-sm transition">CREAR USUARIO TRABAJADOR</button>
                                </form>
                            </div>
                        </section>
                    ` : ''}
                </main>`;

            cargarProductosUI();
        }

        async function login(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            try {
                const res = await fetch(`${API}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.mensaje);
                token = data.token; role = data.role; nombre = data.nombre;
                localStorage.setItem('token', token);
                localStorage.setItem('role', role);
                localStorage.setItem('nombre', nombre);
                if (role === 'OWNER') cargarResumen();
                cargarMisVentas();
                render();
            } catch (err) { alert(err.message); }
        }

        function logout() {
            localStorage.clear();
            token = ''; role = ''; nombre = '';
            render();
        }

        async function cargarProductosUI() {
            try {
                const res = await fetch(`${API}/productos`, { headers: { 'Authorization': `Bearer ${token}` } });
                productos = await res.json();
                const grid = document.getElementById('productos-grid');
                if (!grid) return;
                grid.innerHTML = productos.map(p => `
                    <div class="border-2 border-slate-800 hover:border-slate-700 rounded-3xl p-6 text-center bg-slate-950/80 flex flex-col items-center justify-between shadow-lg relative overflow-hidden transition">
                        <span class="text-7xl my-2 transform hover:scale-110 transition duration-200">${p.imagen || '📦'}</span>
                        <div>
                            <h3 class="text-2xl font-black text-white tracking-tight">${p.nombre}</h3>
                            <span class="text-[10px] uppercase tracking-widest font-extrabold px-2.5 py-1 rounded-full ${p.stock < 10 ? 'bg-rose-500/20 text-rose-400 border border-rose-500/30' : 'bg-slate-800 text-slate-400'} inline-block my-2">
                                Stock: ${p.stock}
                            </span>
                            <p class="text-3xl font-black text-emerald-400 mb-4">$${p.precio}</p>
                        </div>
                        <div class="flex items-center gap-4 bg-slate-900 p-2 rounded-2xl border border-slate-800 w-full justify-between">
                            <button onclick="cambiarCant(${p.id}, -1)" class="bg-rose-500 hover:bg-rose-600 active:scale-95 text-white w-14 h-14 rounded-xl text-3xl font-black shadow flex items-center justify-center transition">-</button>
                            <span class="text-3xl font-black text-white w-12 text-center">${carrito[p.id] || 0}</span>
                            <button onclick="cambiarCant(${p.id}, 1)" class="bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-slate-950 w-14 h-14 rounded-xl text-3xl font-black shadow flex items-center justify-center transition">+</button>
                        </div>
                    </div>
                `).join('');
            } catch (e) { console.error(e); }
        }

        function cambiarCant(id, delta) {
            const actual = carrito[id] || 0;
            carrito[id] = Math.max(0, actual + delta);
            cargarProductosUI();
        }

        async function cobrar() {
            const items = Object.entries(carrito)
                .filter(([_, cant]) => cant > 0)
                .map(([id, cantidad]) => ({ id: Number(id), cantidad }));

            if (items.length === 0) return alert('Selecciona al menos un producto primero');

            try {
                const res = await fetch(`${API}/ventas`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ items })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.mensaje);
                alert('¡VENTA REGISTRADA CON ÉXITO! 🎉');
                carrito = {};
                cargarMisVentas();
                if (role === 'OWNER') cargarResumen();
                render();
            } catch (e) { alert(e.message); }
        }

        async function cargarMisVentas() {
            try {
                const res = await fetch(`${API}/mis-ventas`, { headers: { 'Authorization': `Bearer ${token}` } });
                const data = await res.json();
                misVentasCant = data.misVentas || 0;
            } catch (e) { console.error(e); }
        }

        async function cargarResumen() {
            try {
                const res = await fetch(`${API}/owner/resumen`, { headers: { 'Authorization': `Bearer ${token}` } });
                resumen = await res.json();
                render();
            } catch (e) { console.error(e); }
        }

        async function reiniciarCaja() {
            if (!confirm('¿Estás seguro de reiniciar la caja a $0 y limpiar el contador de rendimiento de los trabajadores?')) return;
            try {
                const res = await fetch(`${API}/owner/reiniciar-caja`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                alert(data.mensaje);
                cargarResumen();
                cargarMisVentas();
            } catch (e) { alert('Error al reiniciar caja'); }
        }

        async function actualizarStock(productoId) {
            const nuevoStock = document.getElementById(`stock-${productoId}`).value;
            const nuevoPrecio = document.getElementById(`precio-${productoId}`).value;
            try {
                await fetch(`${API}/owner/stock`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ productoId, nuevoStock: Number(nuevoStock), nuevoPrecio: Number(nuevoPrecio) })
                });
                alert('¡Producto actualizado correctamente!');
                cargarResumen();
            } catch (e) { alert('Error al actualizar producto'); }
        }

        async function crearProducto(e) {
            e.preventDefault();
            const nombre = document.getElementById('prod-nombre').value;
            const precio = Number(document.getElementById('prod-precio').value);
            const stock = Number(document.getElementById('prod-stock').value);
            const imagen = document.getElementById('prod-imagen').value;

            try {
                await fetch(`${API}/owner/producto`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ nombre, precio, stock, imagen })
                });
                alert('¡Producto creado con éxito!');
                cargarResumen();
            } catch (e) { alert('Error al crear producto'); }
        }

        async function crearEmpleado(e) {
            e.preventDefault();
            const nombreEmp = document.getElementById('emp-nombre').value;
            const emailEmp = document.getElementById('emp-email').value;
            const passEmp = document.getElementById('emp-pass').value;

            try {
                const res = await fetch(`${API}/empleados`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ nombre: nombreEmp, email: emailEmp, password: passEmp })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.mensaje);
                alert('¡Trabajador creado con éxito!');
                cargarResumen();
            } catch (err) { alert(err.message); }
        }

        async function fichajeEntrada() {
            try {
                await fetch(`${API}/fichaje/entrada`, { method: 'POST', headers: { 'Authorization': `Bearer ${token}` } });
                alert('🟢 ¡Entrada registrada con éxito!');
            } catch (e) { alert('Error al fichar entrada'); }
        }

        async function fichajeSalida() {
            try {
                await fetch(`${API}/fichaje/salida`, { method: 'POST', headers: { 'Authorization': `Bearer ${token}` } });
                alert('🔴 ¡Salida registrada con éxito!');
            } catch (e) { alert('Error al fichar salida'); }
        }

        if (token) {
            cargarMisVentas();
            if (role === 'OWNER') cargarResumen();
        }
        render();
    </script>
</body>
</html>
